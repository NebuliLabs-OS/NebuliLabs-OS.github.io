<!DOCTYPE html>
<html>
<head>
    <title>bolb</title>
    <script>
        window.onload = function () {
            const domain = window.location.origin;
            const targetUrl = domain + "/main.html";
            const blobContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>New Tab</title>
                    <style>
                        body, html {
                            margin: 0;
                            padding: 0;
                            height: 100%;
                            overflow: hidden;
                        }
                        iframe {
                            width: 100%;
                            height: 100%;
                            border: none;
                        }
                    </style>
                </head>
                <body>
                    <iframe src="${targetUrl}"></iframe>
                </body>
                </html>
            `;
            const blob = new Blob([blobContent], { type: "text/html" });
            const blobUrl = URL.createObjectURL(blob);
            const newTab = window.open(blobUrl, "_blank");
            newTab.onload = () => {
                newTab.document.title = "New Tab";
            };
        }
    </script>
</head>
<body></body>
</html>
